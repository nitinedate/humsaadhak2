[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "humsaadhak-search"
version = "2.0.0"
description = "Semantic matching between donor purposes and school/NGO needs for HumSaadhak"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
]

[project.optional-dependencies]
# The real models. Kept optional so tests and CI run without downloading weights.
models = ["sentence-transformers>=3.0", "transformers>=4.51", "torch>=2.3"]
training = ["scikit-learn>=1.5"]
dev = ["pytest>=8", "httpx>=0.27"]

# Two top-level packages: the service (app) and the evaluation/calibration scripts (training). Listed explicitly,
# because setuptools refuses to guess in a flat layout (the Docker build installs this project with pip).
[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
