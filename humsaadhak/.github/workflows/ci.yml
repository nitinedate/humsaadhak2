name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: corretto, java-version: '17', cache: maven }   # Amazon Corretto 17, as in the Docker image
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Frontend — type-check, test, build
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Backend — unit tests, module boundaries, integration tests (Testcontainers)
        run: mvn -B -f backend/pom.xml verify
