# Single-VM deployment: HTTPS proxy, app, search, PostgreSQL with pgvector, MinIO. Run it with deploy/deploy.sh
# (see DEPLOYMENT.md): `deploy/deploy.sh init` once, then `deploy/deploy.sh up`.
#
# Encryption in transit: every connection uses TLS 1.2 or 1.3 and every client verifies the server's certificate.
#   browser --HTTPS--> proxy --HTTPS--> app --TLS--> db, search, storage        search --TLS--> db
#   browser --HTTPS--> proxy (FILES_DOMAIN) --HTTPS--> storage                  (document downloads)
# Nothing but the proxy is reachable from outside; the database refuses unencrypted connections.
# Encryption at rest: bank account numbers (HUMSAADHAK_FIELD_KEY) and document files (MinIO SSE, STORAGE_KMS_KEY).
name: humsaadhak

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  proxy:
    restart: unless-stopped
    logging: *logging
    image: caddy:2.8.4
    # The Let's Encrypt contact is optional: "email <address>" only when ACME_EMAIL is set (an empty "email" is an error)
    command: ["sh", "-c", "if [ -n \"$$ACME_EMAIL\" ]; then export ACME_EMAIL_LINE=\"email $$ACME_EMAIL\"; fi; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. humsaadhak.org, or localhost for a trial)}
      FILES_DOMAIN: ${FILES_DOMAIN:?set FILES_DOMAIN (e.g. files.humsaadhak.org, or files.localhost)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls/out/ca.crt:/tls/ca.crt:ro
      - caddy-data:/data
    depends_on: [app, storage]

  # Copies each service's key into a volume owned by that service's user (0400), so no other container can read it.
  tls-init:
    image: busybox:1.36.1
    volumes: ["./tls/out:/in:ro", "tls:/tls"]
    command:
      - sh
      - -c
      - |
        set -e
        for pair in app:10001 search:10002 db:999; do
          svc=$${pair%%:*}; uid=$${pair##*:}
          mkdir -p /tls/$$svc && cp /in/$$svc/tls.crt /in/$$svc/tls.key /in/ca.crt /tls/$$svc/
          chown -R $$uid:$$uid /tls/$$svc && chmod 0500 /tls/$$svc && chmod 0400 /tls/$$svc/tls.key && chmod 0444 /tls/$$svc/tls.crt /tls/$$svc/ca.crt
        done

  # The local database. Production may use a managed PostgreSQL instead (DigitalOcean, RDS): leave COMPOSE_PROFILES
  # without local-db and set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD and DB_CA_FILE (see deploy/.env.prod.example).
  db:
    profiles: [local-db]
    restart: unless-stopped
    logging: *logging
    image: pgvector/pgvector:pg16
    command: >
      postgres -c ssl=on -c ssl_cert_file=/tls/db/tls.crt -c ssl_key_file=/tls/db/tls.key
      -c ssl_min_protocol_version=TLSv1.2 -c password_encryption=scram-sha-256 -c hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${DB_NAME:-humsaadhak}
      POSTGRES_USER: ${DB_USER:-humsaadhak}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - tls:/tls:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, retries: 20 }
    depends_on: { tls-init: { condition: service_completed_successfully } }

  storage:
    restart: unless-stopped
    logging: *logging
    # Built from MinIO's source (deploy/minio/Dockerfile): MinIO no longer publishes free Docker images
    build: ./minio
    image: humsaadhak/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001 --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      # Built-in key for server-side encryption: the app asks for SSE on every upload. Back it up with the files.
      MINIO_KMS_SECRET_KEY: humsaadhak-key:${STORAGE_KMS_KEY:?set STORAGE_KMS_KEY (openssl rand -base64 32)}
      MINIO_SITE_REGION: ap-south-1
    volumes:
      - storage-data:/data
      - ./tls/out/storage:/certs:ro          # public.crt, private.key and CAs/ from make-certs.sh

  search:
    image: humsaadhak/search:${SEARCH_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    build: ../../humsaadhak-search
    environment:
      SEARCH_TOKEN: ${SEARCH_TOKEN:?set SEARCH_TOKEN}
      DATABASE_URL: postgresql://${DB_USER:-humsaadhak}:${DB_PASSWORD}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-humsaadhak}?sslmode=verify-full&sslrootcert=/db-ca/ca.crt
      TLS_CERT_FILE: /tls/search/tls.crt
      TLS_KEY_FILE: /tls/search/tls.key
      REQUIRE_TLS: "true"
      USE_FAKE_MODELS: ${USE_FAKE_MODELS:-false}
      # A fine-tuned model (match-train) is switched on with EMBEDDING_MODEL=/models/humsaadhak-embedding
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      RERANK_TEMPERATURE: ${RERANK_TEMPERATURE:-3.0}
    volumes: ["tls:/tls:ro", "${DB_CA_FILE:-./tls/out/ca.crt}:/db-ca/ca.crt:ro", "search-models:/models"]
    depends_on:
      db: { condition: service_healthy, required: false }     # absent when a managed database is used
      tls-init: { condition: service_completed_successfully }

  # pgAdmin 4: a browser console for the database (profile pgadmin). Only on this computer: http://localhost:5050, bound
  # to 127.0.0.1; on a server, through an SSH tunnel (ssh -L 5050:127.0.0.1:5050 user@server). Sign-in required.
  # The HumSaadhak database is registered with full certificate checks; pgAdmin asks for DB_PASSWORD on first connect.
  pgadmin:
    profiles: [pgadmin]
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/humsaadhak/start.sh"]
    ports: ["127.0.0.1:${PGADMIN_PORT:-5050}:80"]
    environment:
      # Not ":?" here: Compose reads every service, also when the pgadmin profile is off. The scripts check these.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      HS_DB_HOST: ${DB_HOST:-db}
      HS_DB_PORT: ${DB_PORT:-5432}
      HS_DB_NAME: ${DB_NAME:-humsaadhak}
      HS_DB_USER: ${DB_USER:-humsaadhak}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/start.sh:/humsaadhak/start.sh:ro
      - ${DB_CA_FILE:-./tls/out/ca.crt}:/humsaadhak/db-ca.crt:ro
    depends_on:
      db: { condition: service_healthy, required: false }

  app:
    image: humsaadhak/app:${APP_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    build: ..
    environment:
      SPRING_PROFILES_ACTIVE: tls
      REQUIRE_TLS: "true"
      TLS_CERT_FILE: /tls/app/tls.crt
      TLS_KEY_FILE: /tls/app/tls.key
      TLS_CA_FILE: /tls/app/ca.crt
      # The database's certificate is verified against DB_CA_FILE: the internal CA for the local database, the provider's CA otherwise
      DB_URL: jdbc:postgresql://${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-humsaadhak}?sslmode=verify-full&sslrootcert=/db-ca/ca.crt
      DB_USER: ${DB_USER:-humsaadhak}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      SEARCH_URL: https://search:8000
      SEARCH_TOKEN: ${SEARCH_TOKEN}
      STORAGE_ENDPOINT: https://storage:9000
      STORAGE_PUBLIC_ENDPOINT: https://${FILES_DOMAIN}
      STORAGE_BUCKET: humsaadhak-documents
      STORAGE_CREATE_BUCKET: "true"
      STORAGE_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_REGION: ap-south-1
      HUMSAADHAK_FIELD_KEY: ${HUMSAADHAK_FIELD_KEY:?set HUMSAADHAK_FIELD_KEY (openssl rand -base64 32)}
      HUMSAADHAK_BOOTSTRAP_ADMIN_EMAIL: ${HUMSAADHAK_BOOTSTRAP_ADMIN_EMAIL:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: ${MAIL_FROM:-support@humsaadhak.com}
      # MAIL_PROVIDER=smtp: the mail server (e.g. smtp.office365.com, port 587 with STARTTLS)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL_TRUST: ${SMTP_SSL_TRUST:-}
      MAIL_LOG_LINKS: ${MAIL_LOG_LINKS:-false}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
    volumes: ["tls:/tls:ro", "${DB_CA_FILE:-./tls/out/ca.crt}:/db-ca/ca.crt:ro"]
    depends_on:
      db: { condition: service_healthy, required: false }     # absent when a managed database is used
      search: { condition: service_started }
      storage: { condition: service_started }
      tls-init: { condition: service_completed_successfully }

volumes:
  db-data:
  search-models:
  storage-data:
  caddy-data:
  tls:
  pgadmin-data:
